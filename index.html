<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Revista Academica de Contabilidad Administrativa</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #2b2b2b;
    }
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 44px;
      background: #1f1f1f;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      font-size: 14px;
      z-index: 10;
    }
    .topbar a {
      color: #fff;
      text-decoration: none;
      background: #3b82f6;
      padding: 6px 10px;
      border-radius: 6px;
    }
    .viewer-wrap {
      position: absolute;
      top: 44px;
      left: 0;
      right: 0;
      bottom: 0;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #fff;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div>Revista Académica de Contabilidad Administrativa</div>
    <a href="revista-de-contabilidad-administrativa-c.pdf" target="_blank" rel="noopener">Abrir PDF</a>
  </div>

  <div class="viewer-wrap">
    <iframe
      src="https://mozilla.github.io/pdf.js/web/viewer.html?file=revista-de-contabilidad-administrativa-c.pdf#page=1&zoom=page-fit&pagemode=none">
    </iframe>
  </div>
</body>
</html>
