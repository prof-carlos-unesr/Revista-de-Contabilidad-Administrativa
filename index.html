<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Revista Académica de Contabilidad Administrativa</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    .topbar {
      height: 54px;
      background: linear-gradient(90deg, #0f172a, #1e293b);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      box-sizing: border-box;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .brand {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }
    .brand .title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .2px;
    }
    .brand .subtitle {
      font-size: 11px;
      color: #cbd5e1;
      margin-top: 2px;
    }
    .viewer-frame {
      width: 100%;
      height: calc(100% - 54px);
      border: none;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <div class="title">Revista Académica de Contabilidad Administrativa</div>
      <div class="subtitle">Maestría en Gerencia General</div>
    </div>
  </div>

  <!-- Visor oficial de PDF.js servido desde jsDelivr, cargando tu PDF.[web:54][web:50] -->
  <iframe
    class="viewer-frame"
    src="https://cdn.jsdelivr.net/npm/pdf.js-dist-viewer@0.3.0/web/viewer.html?file=%2FRevista-de-Contabilidad-Administrativa%2Frevista-de-contabilidad-administrativa-c.pdf">
  </iframe>
</body>
</html>
