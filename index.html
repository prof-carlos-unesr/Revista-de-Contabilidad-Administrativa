<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Revista Académica de Contabilidad Administrativa</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1f1f1f;
      font-family: Arial, sans-serif;
    }

    .toolbar {
      height: 48px;
      background: #111827;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      box-sizing: border-box;
      gap: 10px;
    }

    .toolbar .left {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
    }

    .toolbar .right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .toolbar button {
      background: #2563eb;
      color: #fff;
      border: 0;
      padding: 8px 11px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
    }

    .toolbar button:hover {
      background: #1d4ed8;
    }

    .pageinfo {
      color: #d1d5db;
      font-size: 14px;
      min-width: 110px;
      text-align: center;
    }

    .viewer {
      width: 100%;
      height: calc(100% - 48px);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #2b2b2b;
      position: relative;
    }

    #pdfCanvas {
      background: #fff;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
      max-width: 100%;
      max-height: 100%;
    }

    .error {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="left">Revista Académica de Contabilidad Administrativa</div>
    <div class="right">
      <button id="prev">Anterior</button>
      <button id="zoomOut">- Zoom</button>
      <div class="pageinfo" id="pageInfo">Cargando...</div>
      <button id="zoomIn">+ Zoom</button>
      <button id="next">Siguiente</button>
    </div>
  </div>

  <div class="viewer">
    <canvas id="pdfCanvas"></canvas>
    <div class="error" id="errorBox">
      No se pudo cargar el PDF. Revisa el nombre del archivo y que esté en la misma carpeta.
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.min.mjs" type="module"></script>
  <script type="module">
    import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.min.mjs';
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.worker.min.mjs';

    const url = 'revista-de-contabilidad-administrativa-c.pdf';
    const canvas = document.getElementById('pdfCanvas');
    const ctx = canvas.getContext('2d');
    const pageInfo = document.getElementById('pageInfo');
    const errorBox = document.getElementById('errorBox');

    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');
    const zoomInBtn = document.getElementById('zoomIn');
    const zoomOutBtn = document.getElementById('zoomOut');

    let pdfDoc = null;
    let pageNum = 1;
    let pageRendering = false;
    let pageNumPending = null;
    let scale = 1.20;

    function fitScale(page) {
      const viewport = page.getViewport({ scale: 1 });
      const viewer = document.querySelector('.viewer');
      const vw = viewer.clientWidth - 20;
      const vh = viewer.clientHeight - 20;
      return Math.min(vw / viewport.width, vh / viewport.height);
    }

    function renderPage(num) {
      if (!pdfDoc) return;
      pageRendering = true;

      pdfDoc.getPage(num).then(page => {
        const viewport = page.getViewport({ scale });
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        canvas.style.width = viewport.width + 'px';
        canvas.style.height = viewport.height + 'px';

        const renderContext = {
          canvasContext: ctx,
          viewport: viewport
        };

        const renderTask = page.render(renderContext);
        renderTask.promise.then(() => {
          pageRendering = false;
          pageInfo.textContent = `Página ${pageNum} de ${pdfDoc.numPages} | Zoom ${Math.round(scale * 100)}%`;
          if (pageNumPending !== null) {
            const n = pageNumPending;
            pageNumPending = null;
            renderPage(n);
          }
        });
      });
    }

    function queueRenderPage(num) {
      if (pageRendering) pageNumPending = num;
      else renderPage(num);
    }

    function renderCurrentPage() {
      queueRenderPage(pageNum);
    }

    function onPrevPage() {
      if (pageNum <= 1) return;
      pageNum--;
      renderCurrentPage();
    }

    function onNextPage() {
      if (pageNum >= pdfDoc.numPages) return;
      pageNum++;
      renderCurrentPage();
    }

    function onZoomIn() {
      if (scale < 2.5) {
        scale = Math.min(2.5, +(scale + 0.15).toFixed(2));
        renderCurrentPage();
      }
    }

    function onZoomOut() {
      if (scale > 0.5) {
        scale = Math.max(0.5, +(scale - 0.15).toFixed(2));
        renderCurrentPage();
      }
    }

    prevBtn.addEventListener('click', onPrevPage);
    nextBtn.addEventListener('click', onNextPage);
    zoomInBtn.addEventListener('click', onZoomIn);
    zoomOutBtn.addEventListener('click', onZoomOut);

    window.addEventListener('resize', () => {
      if (!pdfDoc) return;
      pdfDoc.getPage(pageNum).then(page => {
        scale = fitScale(page);
        renderCurrentPage();
      });
    });

    pdfjsLib.getDocument(url).promise.then(pdf => {
      pdfDoc = pdf;
      pdfDoc.getPage(pageNum).then(page => {
        scale = fitScale(page);
        renderCurrentPage();
      });
    }).catch(err => {
      console.error(err);
      errorBox.style.display = 'flex';
      pageInfo.textContent = 'Error al cargar';
    });
  </script>
</body>
</html>
