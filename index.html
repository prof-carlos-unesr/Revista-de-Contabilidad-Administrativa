<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Revista Académica de Contabilidad Administrativa</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #18181b;
      font-family: Arial, sans-serif;
    }

    .topbar {
      height: 54px;
      background: linear-gradient(90deg, #0f172a, #1e293b);
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      box-sizing: border-box;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      gap: 12px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
      min-width: 0;
    }

    .brand .title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .2px;
    }

    .brand .subtitle {
      font-size: 11px;
      color: #cbd5e1;
      margin-top: 2px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .controls button {
      border: 1px solid rgba(255,255,255,0.16);
      background: #1d4ed8;
      color: #fff;
      border-radius: 6px;
      padding: 7px 10px;
      cursor: pointer;
      font-size: 13px;
      line-height: 1;
    }

    .controls button:hover {
      background: #2563eb;
    }

    .pageinfo {
      min-width: 170px;
      text-align: center;
      color: #e2e8f0;
      font-size: 13px;
      padding: 0 6px;
    }

    .viewer {
      width: 100%;
      height: calc(100% - 54px);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #2a2a2e;
      position: relative;
    }

    #pdfCanvas {
      background: #fff;
      box-shadow: 0 12px 30px rgba(0,0,0,.35);
      max-width: 100%;
      max-height: 100%;
    }

    .error {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-align: center;
      padding: 20px;
    }

    @media (max-width: 700px) {
      .topbar {
        height: auto;
        padding: 10px 12px;
        flex-direction: column;
        align-items: stretch;
      }
      .controls {
        justify-content: center;
      }
      .viewer {
        height: calc(100% - 96px);
      }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <div class="title">Revista Académica de Contabilidad Administrativa</div>
      <div class="subtitle">Maestría en Gerencia General</div>
    </div>

    <div class="controls">
      <button id="prev">Anterior</button>
      <button id="fitPage">Ajustar a página</button>
      <button id="zoom100">100%</button>
      <button id="zoomOut">-</button>
      <div class="pageinfo" id="pageInfo">Cargando...</div>
      <button id="zoomIn">+</button>
      <button id="next">Siguiente</button>
    </div>
  </div>

  <div class="viewer">
    <canvas id="pdfCanvas"></canvas>
    <div class="error" id="errorBox">
      No se pudo cargar el PDF. Verifica que el archivo <strong>revista-de-contabilidad-administrativa-c.pdf</strong> esté en la misma carpeta.
    </div>
  </div>

  <!-- PDF.js desde CDN, misma versión que usabas.[web:12] -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.min.mjs" type="module"></script>
  <script type="module">
    import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.min.mjs';
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.worker.min.mjs';[web:12][web:18]

    const url = 'revista-de-contabilidad-administrativa-c.pdf'; // nombre del archivo PDF, igual que en tu código.
    const canvas = document.getElementById('pdfCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const pageInfo = document.getElementById('pageInfo');
    const errorBox = document.getElementById('errorBox');

    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');
    const zoomInBtn = document.getElementById('zoomIn');
    const zoomOutBtn = document.getElementById('zoomOut');
    const fitPageBtn = document.getElementById('fitPage');
    const zoom100Btn = document.getElementById('zoom100');

    let pdfDoc = null;
    let pageNum = 1;
    let pageRendering = false;
    let pageNumPending = null;

    // mode: 'fit' usa siempre el ajuste a página; 'custom' usa zoomFactor relativo al fit.[web:11]
    let mode = 'fit';
    let zoomFactor = 1.0;    // 1.0 = 100% respecto al "ajustar a página"
    const step = 0.5;        // cada click del botón "100%" cambia 50% (0.5)

    function getPageBaseFit(page) {
      const viewport = page.getViewport({ scale: 1 });
      const viewer = document.querySelector('.viewer');
      const vw = viewer.clientWidth - 24;
      const vh = viewer.clientHeight - 24;
      // Escala base que hace que la página quepa en el visor.[web:2]
      return Math.min(vw / viewport.width, vh / viewport.height);
    }

    function getRenderScale(page) {
      const fit = getPageBaseFit(page);
      if (mode === 'fit') return fit;
      // modo custom: aplicar zoomFactor relativo al ajuste base.[web:11]
      return fit * zoomFactor;
    }

    function renderPage(num) {
      if (!pdfDoc) return;
      pageRendering = true;

      pdfDoc.getPage(num).then(page => {
        const scale = getRenderScale(page);
        const viewport = page.getViewport({ scale });
        const outputScale = window.devicePixelRatio || 1;

        canvas.width = Math.floor(viewport.width * outputScale);
        canvas.height = Math.floor(viewport.height * outputScale);
        canvas.style.width = Math.floor(viewport.width) + 'px';
        canvas.style.height = Math.floor(viewport.height) + 'px';

        ctx.setTransform(outputScale, 0, 0, outputScale, 0, 0);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';

        const renderContext = {
          canvasContext: ctx,
          viewport: viewport
        };

        const renderTask = page.render(renderContext);
        renderTask.promise.then(() => {
          pageRendering = false;

          // Texto de zoom mostrado.
          let zoomText;
          if (mode === 'fit') {
            zoomText = 'Ajustar a página';
          } else {
            const pct = Math.round(zoomFactor * 100);
            zoomText = `${pct}%`;
          }

          pageInfo.textContent = `Página ${pageNum} de ${pdfDoc.numPages} | ${zoomText}`;

          if (pageNumPending !== null) {
            const n = pageNumPending;
            pageNumPending = null;
            renderPage(n);
          }
        });
      });
    }

    function queueRenderPage(num) {
      if (pageRendering) pageNumPending = num;
      else renderPage(num);
    }

    function renderCurrentPage() {
      queueRenderPage(pageNum);
    }

    function onPrevPage() {
      if (pageNum <= 1) return;
      pageNum--;
      renderCurrentPage();
    }

    function onNextPage() {
      if (pageNum >= pdfDoc.numPages) return;
      pageNum++;
      renderCurrentPage();
    }

    function onZoomIn() {
      mode = 'custom';
      // Zoom fino con los botones +/-, independiente del botón "100%".[web:11]
      zoomFactor = Math.min(5, +(zoomFactor + 0.15).toFixed(2));
      renderCurrentPage();
    }

    function onZoomOut() {
      mode = 'custom';
      zoomFactor = Math.max(0.2, +(zoomFactor - 0.15).toFixed(2));
      renderCurrentPage();
    }

    // Ajustar completamente a página
    function onFitPage() {
      mode = 'fit';
      zoomFactor = 1.0;
      renderCurrentPage();
    }

    // Botón "100%": cada clic aumenta 50% (step), y al pasar un límite vuelve a 100%.
    function onZoom100() {
      mode = 'custom';
      zoomFactor += step;          // incremento de 0.5 = 50%
      if (zoomFactor > 4) {        // límite de 400% antes de volver a 100%
        zoomFactor = 1.0;
      }
      renderCurrentPage();
    }

    prevBtn.addEventListener('click', onPrevPage);
    nextBtn.addEventListener('click', onNextPage);
    zoomInBtn.addEventListener('click', onZoomIn);
    zoomOutBtn.addEventListener('click', onZoomOut);
    fitPageBtn.addEventListener('click', onFitPage);
    zoom100Btn.addEventListener('click', onZoom100);

    window.addEventListener('resize', () => {
      if (!pdfDoc) return;
      renderCurrentPage();
    });

    pdfjsLib.getDocument(url).promise.then(pdf => {
      pdfDoc = pdf;
      renderCurrentPage();
    }).catch(err => {
      console.error(err);
      errorBox.style.display = 'flex';
      pageInfo.textContent = 'Error al cargar';
    });
  </script>
</body>
</html>
